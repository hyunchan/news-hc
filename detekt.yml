build:
  maxIssues: 10        # 최대 10개의 위반까지 허용 (CI 안정화 단계에서 유용)

config:
  validation: true
  warningsAsErrors: false  # warning은 단순 경고로만 (개발 중 빌드 실패 방지)
  checkExhaustiveness: true

processors:
  active: true

formatting:
  active: true
  android: true
  autoCorrect: true
  useTabs: false
  indentSize: 4
  continuationIndentSize: 4
  maxLineLength:
    active: true
    maxLineLength: 120

complexity:
  active: true
  ComplexMethod:
    active: true
    threshold: 20       # 20줄 이상이면 복잡한 함수로 간주
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 20
  LargeClass:
    active: true
    threshold: 600      # 600줄 이상이면 큰 클래스 경고
  LongParameterList:
    active: true
    threshold: 6
  NestedBlockDepth:
    active: true
    threshold: 5

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: [ "-1", "0", "1", "2" ]
    ignoreHashCodeFunction: true
    ignoreAnnotation: true
  UnusedImports:
    active: true
  WildcardImport:
    active: true
    excludeImports: [ "java.util.*", "kotlinx.coroutines.*" ]
  OptionalWhenBraces:
    active: false       # Compose의 when 블록에서 불필요하게 경고 주는 경우 방지
  BracesOnIfStatements:
    active: false
  NewLineAtEndOfFile:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
    excludes: [ '**/test/**' ]
  VariableNaming:
    active: true
  ClassNaming:
    active: true
  PackageNaming:
    active: true

comments:
  active: false

potential-bugs:
  active: true
  LateinitUsage:
    active: true
    excludeAnnotatedProperties: [ "Inject" ]

performance:
  active: true
  SpreadOperator:
    active: false       # Kotlin의 편의 구문 사용을 허용
  UnnecessaryTemporaryInstantiation:
    active: true

output-reports:
  active: true
  exclude:
    - 'TxtOutputReport'
    - 'XmlOutputReport'